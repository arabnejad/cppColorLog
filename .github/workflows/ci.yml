name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  linux-build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gcc
            cc: gcc
            cxx: g++
          - name: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CXXFLAGS: -std=c++11
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '3.28.0'


      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y build-essential clang

      - name: Build and run unit tests
        run: make test BUILD_DIR=build-${{ matrix.name }}

      - name: Build and run examples
        run: make run-examples BUILD_DIR=build-${{ matrix.name }}

  windows-build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '3.28.0'

      - name: Configure project
        run: cmake -S . -B build -DCPPCOLORLOGGER_BUILD_TESTS=ON -DCPPCOLORLOGGER_BUILD_EXAMPLES=ON

      - name: Build project
        run: cmake --build build --config Release

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run examples
        run: cmake --build build --config Release --target cppcolorlogger_run_examples
